<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photo Inventory Contact Sheet</title>
<style>
body {font-family: Arial, sans-serif; margin: 20px;}
table {border-collapse: collapse; width: 100%;}
th, td {border: 1px solid #ddd; padding: 8px; text-align: left;}
th {background-color: #f2f2f2;}
img {max-width: 120px; height: auto;}
.filter {margin-bottom: 15px;}
</style>
</head>
<body>
<h1>Photo Inventory Contact Sheet</h1>
<div class="filter">
  <label>Batch: <select id="batchFilter"><option value="">All</option></select></label>
  <label>Uploader: <select id="uploaderFilter"><option value="">All</option></select></label>
</div>
<table id="photoTable">
  <thead>
    <tr><th>Thumbnail</th><th>ID</th><th>Uploader</th><th>Created At</th><th>Batch</th><th>Object Path</th></tr>
  </thead>
  <tbody></tbody>
</table>
<script>
fetch('photo-inventory.json')
  .then(r => r.json())
  .then(data => {
    const tbody = document.querySelector('#photoTable tbody');
    const batchSet = new Set();
    const uploaderSet = new Set();
    data.forEach(rec => {
      const tr = document.createElement('tr');
      tr.dataset.batch = rec.batch || '';
      tr.dataset.uploader = rec.uploader_name || '';
      const tdImg = document.createElement('td');
      const a = document.createElement('a');
      a.href = rec.url;
      a.target = '_blank';
      const img = document.createElement('img');
      img.src = rec.url;
      a.appendChild(img);
      tdImg.appendChild(a);
      tr.appendChild(tdImg);
      const tdId = document.createElement('td'); tdId.textContent = rec.id; tr.appendChild(tdId);
      const tdUploader = document.createElement('td'); tdUploader.textContent = rec.uploader_name || '';
      tr.appendChild(tdUploader);
      const tdCreated = document.createElement('td'); tdCreated.textContent = rec.created_at; tr.appendChild(tdCreated);
      const tdBatch = document.createElement('td'); tdBatch.textContent = rec.batch || '';
      tr.appendChild(tdBatch);
      const tdPath = document.createElement('td'); tdPath.textContent = rec.object_path || '';
      tr.appendChild(tdPath);
      tbody.appendChild(tr);
      batchSet.add(rec.batch);
      uploaderSet.add(rec.uploader_name);
    });
    const batchFilter = document.getElementById('batchFilter');
    batchSet.forEach(b => { if(b){ const opt=document.createElement('option'); opt.value=b; opt.textContent=b; batchFilter.appendChild(opt);} });
    const uploaderFilter = document.getElementById('uploaderFilter');
    uploaderSet.forEach(u => { if(u){ const opt=document.createElement('option'); opt.value=u; opt.textContent=u; uploaderFilter.appendChild(opt);} });
    function filterRows(){
      const batch = batchFilter.value;
      const uploader = uploaderFilter.value;
      document.querySelectorAll('#photoTable tbody tr').forEach(row=>{
        const matchBatch = !batch || row.dataset.batch===batch;
        const matchUploader = !uploader || row.dataset.uploader===uploader;
        row.style.display = (matchBatch && matchUploader) ? '' : 'none';
      });
    }
    batchFilter.addEventListener('change', filterRows);
    uploaderFilter.addEventListener('change', filterRows);
  })
  .catch(err => console.error('Failed to load inventory', err));
</script>
</body>
</html>
