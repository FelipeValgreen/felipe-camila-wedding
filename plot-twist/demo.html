<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171216"><title>Plot Twist · Demo interactiva V2</title><style>
:root{--bg:#171216;--paper:#241b21;--paper2:#30232b;--cream:#f5efe5;--muted:#c6b8b8;--gold:#d4b57a;--wine:#8d4359;--green:#80bba1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#49313d 0,transparent 44%),var(--bg);color:var(--cream);font-family:system-ui,-apple-system,sans-serif;min-height:100svh}.wrap{max-width:550px;margin:auto;padding:20px 18px 50px}.brand{display:flex;align-items:center;gap:14px;border-bottom:1px solid #d4b57a44;padding:10px 0 20px}.brand img{width:50px}.brand small,.tag{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);font-weight:700}.brand h1{font:normal 38px Georgia,serif;margin:3px 0}.top{display:flex;justify-content:space-between;align-items:center;margin:20px 0;font-size:12px;color:var(--muted)}.top button{border:0;background:none;color:var(--gold);font:inherit}.track{height:5px;background:#ffffff22;border-radius:10px;overflow:hidden;margin-bottom:20px}.track div{height:100%;background:var(--gold);transition:width .3s}.card{background:linear-gradient(155deg,var(--paper2),var(--paper));border:1px solid #d4b57a55;border-radius:18px;padding:27px 22px;box-shadow:0 22px 60px #0005;min-height:410px}.card h2{font:normal clamp(29px,7vw,42px) Georgia,serif;line-height:1.1;margin:12px 0 18px}.card p{line-height:1.6;color:#e6dce0;margin:0 0 18px}.card label{display:block;font-size:13px;color:var(--muted);margin:16px 0 8px}.card input,.card textarea,.card select{width:100%;background:#120e12;color:var(--cream);border:1px solid #bfa98477;border-radius:9px;padding:15px;font:inherit}.card textarea{min-height:95px}.card button{width:100%;padding:15px;border:1px solid #d4b57a88;border-radius:10px;background:#ffffff09;color:var(--cream);font:600 14px system-ui;margin-top:10px;cursor:pointer;min-height:52px}.card button.primary{background:var(--gold);color:#211820;border-color:var(--gold);margin-top:22px}.card button:disabled{opacity:.35;cursor:not-allowed}.card button.selected{background:#d4b57a33;border-color:var(--gold)}.card button.secondary{background:#ffffff11}.note{text-align:center;color:#c6b8b8;font-size:12px;line-height:1.6;margin-top:22px}.points{display:flex;justify-content:space-between;padding:12px 15px;border:1px solid #d4b57a55;border-radius:10px;margin:14px 0;color:var(--gold);font-weight:700}.hint{font-size:13px;color:var(--muted);line-height:1.5}.feedback{padding:14px;background:#80bba11a;border:1px solid #80bba166;border-radius:10px;margin-top:15px}.feedback.bad{background:#a9564d22;border-color:#a9564d77}.wheel{height:225px;width:225px;border-radius:50%;margin:25px auto;background:conic-gradient(#d4b57a 0 25%,#426b70 25% 50%,#83566d 50% 75%,#a66b46 75% 100%);border:8px solid #e9d7b6;display:grid;place-items:center;position:relative;transition:transform 3.2s cubic-bezier(.13,.72,.13,1);box-shadow:0 0 30px #d4b57a33}.wheel:before{content:'▼';position:absolute;top:-32px;color:var(--gold);font-size:28px}.wheel b{background:#f4efe6;color:#2c2028;padding:15px;border-radius:50%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;border-radius:10px;background:#ffffff0b;text-align:center}.stat strong{display:block;font-size:22px;color:var(--gold)}.stage{padding:12px;border-left:2px solid var(--gold);margin:12px 0;background:#ffffff09}.photo{max-width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin:12px 0}.finale{text-align:center;padding:30px 0}.finale h2{color:var(--gold)}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #d4b57a55;border-radius:20px;padding:7px 10px;font-size:12px}.reveal{animation:appear .7s ease}@keyframes appear{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body><main class="wrap"><header class="brand"><img src="/images/isotype-fc-200w.png" alt="F&C"><div><small>Felipe & Cami · 23.10.26</small><h1>Plot Twist</h1></div></header><div class="top"><button id="demo-back" type="button">← Atrás</button><span id="demo-progress"></span></div><div class="track"><div id="demo-track"></div></div><section id="demo-card" class="card" aria-live="polite"></section><p class="note">DEMO V2 INTERACTIVA · Datos y puntajes simulados, guardados solo durante esta visita. No conecta con Supabase, no envía fotos ni modifica el matrimonio.</p></main><script type="module" src="/plot-twist/demo.js"></script></body></html>
