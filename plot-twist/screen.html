<!doctype html><html lang=es><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Plot Twist · La noche</title><style>body{margin:0;background:#0f0c0b;color:#f3efe7;font-family:Inter,system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(1200px,90vw)}h1{font-family:Georgia,serif;font-size:clamp(56px,8vw,120px);margin:0;color:#c5a059}.moment{font-size:clamp(28px,4vw,60px);max-width:1000px}.radar{display:flex;gap:24px;margin-top:48px}.radar div{border:1px solid #5c1d24;padding:20px;border-radius:18px}small{color:#918d85}</style><div class=wrap><small>FELIPE & CAMI · 23.10.26</small><h1>PLOT TWIST</h1><div id=moment class=moment>La noche recién comienza.</div><div id=radar class=radar></div></div><script>async function tick(){try{const d=await fetch('/api/plot-twist/screen',{cache:'no-store'}).then(r=>r.json());const e=d.events?.[0];moment.textContent=e?.payload?.text||e?.payload?.title||'Sigan disfrutando. Plot Twist volverá.';radar.innerHTML='';setInterval(tick,10000)</script></html>
