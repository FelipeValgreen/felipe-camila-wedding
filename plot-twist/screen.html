<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plot Twist · La noche</title><style>body{margin:0;background:#0f0c0b;color:#f3efe7;font-family:Inter,system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(1200px,90vw)}h1{font-family:Georgia,serif;font-size:clamp(56px,8vw,120px);margin:0;color:#c5a059}.moment{font-size:clamp(28px,4vw,60px);max-width:1000px;margin-top:32px}small{color:#918d85}svg{width:100%;height:45vh}line{stroke:#c5a059;stroke-width:2}circle{fill:#c5a059}text{fill:#f3efe7;font-size:12px;text-anchor:middle}</style><div class="wrap"><small>FELIPE & CAMI · 23.10.26</small><h1>PLOT TWIST</h1><div id="moment" class="moment">La noche recién comienza.</div><div id="network"></div></div><script>function draw(f){const host=document.getElementById('network');host.replaceChildren();const ts=f.network?.tables||[],ls=f.network?.links||[];if(!ts.length)return;const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 1000 460');const pos=new Map(ts.map((t,i)=>[t.id,[500+350*Math.cos(i*2*Math.PI/ts.length),220+160*Math.sin(i*2*Math.PI/ts.length)]]));function add(tag,attrs,label){const el=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));if(label)el.textContent=label;svg.append(el)}ls.forEach(l=>{const a=pos.get(l.source),b=pos.get(l.target);if(a&&b)add('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1]})});ts.forEach(t=>{const p=pos.get(t.id);add('circle',{cx:p[0],cy:p[1],r:7});add('text',{x:p[0],y:p[1]+24},t.name||'Mesa')});host.append(svg)}async function tick(){try{const d=await fetch('/api/plot-twist/screen',{cache:'no-store'}).then(r=>r.json());if(d.finale)draw(d.finale);else document.getElementById('network').replaceChildren();const e=d.events&&d.events[0];moment.textContent=d.finale?.message||(e&&e.payload&&(e.payload.text||e.payload.title))||'Sigan disfrutando. Plot Twist volverá.'}catch{moment.textContent='Sigan disfrutando. Volvemos en un momento.'}}tick();setInterval(tick,10000);</script></html>
