<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plot Twist · La noche</title><style>body{margin:0;background:#0f0c0b;color:#f3efe7;font-family:Inter,system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(1200px,90vw)}h1{font-family:Georgia,serif;font-size:clamp(56px,8vw,120px);margin:0;color:#c5a059}.moment{font-size:clamp(28px,4vw,60px);max-width:1000px;margin-top:32px}small{color:#918d85}</style><div class="wrap"><small>FELIPE & CAMI · 23.10.26</small><h1>PLOT TWIST</h1><div id="moment" class="moment">La noche recién comienza.</div></div><script>async function tick(){try{const d=await fetch('/api/plot-twist/screen',{cache:'no-store'}).then(r=>r.json());const e=d.events&&d.events[0];moment.textContent=(e&&e.payload&&(e.payload.text||e.payload.title))||'Sigan disfrutando. Plot Twist volverá.'}catch{moment.textContent='Sigan disfrutando. Volvemos en un momento.'}}tick();setInterval(tick,10000);</script></html>
