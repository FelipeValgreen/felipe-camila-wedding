<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F0C0B"><title>Plot Twist · Felipe & Cami</title><link rel="stylesheet" href="/css/style.css"><style>
:root{--ink:#0F0C0B;--cream:#F3EFE7;--light:#FAF8F3;--muted:#918D85;--wine:#5C1D24;--gold:#C5A059}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--cream);font-family:Inter,system-ui,sans-serif;min-height:100svh}.pt{max-width:520px;margin:auto;padding:28px 20px 110px}.brand{display:flex;align-items:center;gap:14px}.brand img{width:46px}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}h1,h2{font-family:Newsreader,Georgia,serif;font-weight:400}h1{font-size:38px;margin:3px 0}.status{color:#c8c1b7;margin:16px 0 22px}.offline{display:none;background:#2a2420;border:1px solid #51473d;padding:12px 14px;border-radius:14px;margin-bottom:14px;font-size:14px}.offline.on{display:block}.card{background:var(--cream);color:var(--ink);border-radius:26px;padding:26px 22px;box-shadow:0 20px 70px #0008}.card h2{font-size:30px;line-height:1.05;margin:0 0 10px}.card p{line-height:1.55}.hint{color:#665f58;font-size:14px}.tag{display:inline-block;color:var(--wine);font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}input{width:100%;font:inherit;font-size:18px;border:1px solid #d8d0c4;background:var(--light);border-radius:14px;padding:16px;margin:8px 0}button{width:100%;border:0;border-radius:14px;padding:16px 18px;margin-top:10px;background:var(--wine);color:white;font-weight:800;font-size:15px;min-height:54px}.nav{position:fixed;bottom:0;left:0;right:0;background:#15110fee;border-top:1px solid #ffffff18;backdrop-filter:blur(16px);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}.nav div{max-width:520px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.nav button{background:transparent;color:#aaa19a;padding:8px 4px;margin:0;min-height:44px;font-size:12px}.nav button.active{color:var(--cream)}
</style></head><body><main class="pt"><header class="brand"><img src="/images/isotype-fc-200w.png" alt="F&C"><div><div class="eyebrow">Felipe & Cami · 23.10.26</div><h1>Plot Twist</h1></div></header><p id="status" class="status">Recuperando tu mesa…</p><div id="offline" class="offline">📡 Estás sin conexión. Lo que ya confirmaste sigue guardado. Intentaremos volver automáticamente.</div><section id="card"></section></main><nav class="nav" id="nav" hidden><div><button data-view="now" class="active">Ahora</button><button data-view="night">La noche</button><button data-view="table">Mi mesa</button></div></nav><script type="module" src="/plot-twist/app.js"></script></body></html>
