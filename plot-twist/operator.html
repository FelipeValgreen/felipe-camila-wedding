<!doctype html><html lang=es><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Plot Twist · Operador</title><style>body{font-family:system-ui;background:#0f0c0b;color:#f3efe7;max-width:900px;margin:auto;padding:24px}button,input{padding:12px;margin:4px;border-radius:9px;border:0}button{background:#5c1d24;color:white;font-weight:700}.stage{border:1px solid #554b43;border-radius:14px;padding:14px;margin:10px 0}.open{border-color:#c5a059}small{color:#aaa}pre{white-space:pre-wrap}</style><h1>Plot Twist · Operador</h1><p>Panel de contingencia. El juego debe funcionar sin tocar esto durante la cena.</p><input id=k type=password placeholder="Clave operador"><button id=load>Cargar estado</button><div id=summary></div><div id=stages></div><script>
const q=(op,data={})=>fetch('/api/plot-twist/operator',{method:op?'POST':'GET',headers:{'Content-Type':'application/json','x-plot-twist-key':k.value},body:op?JSON.stringify({op,...data}):undefined}).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.error);return j});
async function refresh(){try{const d=await q();const ready=d.tables.filter(x=>x.ready).length;summary.innerHTML='<h2>'+d.game.status+'</h2><p>'+ready+'/'+d.tables.length+' mesas listas · etapa '+(d.game.current_stage_key||'—')+'</p>';stages.innerHTML=d.stages.map(s=>'<div class="stage '+(s.status==='open'?'open':'')+'"><b>'+s.position+' · '+s.stage_key+'</b> <small>'+s.status+' · '+s.type+'</small><br><button onclick="act(\'open\',\''+s.id+'\')">Abrir</button><button onclick="act(\'close\',\''+s.id+'\')">Cerrar</button>'+(s.type==='table_decision'?'<button onclick="resolveStage(\''+s.id+'\')">Resolver</button>':'')+'</div>').join('')}catch(e){summary.textContent=e.message}}
async function act(op,id){await q(op,{stageId:id});refresh()}async function resolveStage(id){const a=prompt('Respuesta correcta');if(a===null)return;const p=Number(prompt('Puntos','300')||0);await q('resolve',{stageId:id,correctAnswer:a,points:p});refresh()}load.onclick=refresh;
</script></html>
