<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plot Twist · Operador</title><style>body{font-family:Inter,system-ui;background:#0f0c0b;color:#f3efe7;max-width:980px;margin:auto;padding:24px}button,input{padding:12px;margin:4px;border:1px solid #6b5d50;background:#171311;color:#f3efe7}button{background:#5c1d24;border-color:#5c1d24;font-weight:700}.stage{border:1px solid #554b43;padding:14px;margin:10px 0}.open{border-color:#c5a059}small{color:#aaa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><h1>Plot Twist · Operador</h1><p>Contingencia. La cena debería poder correr sin usar este panel.</p><input id="k" type="password" placeholder="Clave operador"><button id="load">Cargar estado</button><div id="summary"></div><div class="grid"><div><h2>Etapas</h2><div id="stages"></div></div><div><h2>Mesas</h2><div id="tables"></div></div></div><script>
const q=(op,data={})=>fetch('/api/plot-twist/operator',{method:op?'POST':'GET',headers:{'Content-Type':'application/json','x-plot-twist-key':k.value},body:op?JSON.stringify({op,...data}):undefined}).then(async r=>{const j=await r.json();if(!r.ok)throw Error(j.error||j.reason||'ERROR');return j});
async function refresh(){try{const d=await q();summary.innerHTML='<h2>'+d.game.status+'</h2><p>'+d.readiness.ready+'/'+d.readiness.total+' mesas listas · '+Math.round(d.readiness.ratio*100)+'% · etapa '+(d.game.current_stage_key||'—')+'</p><button onclick="advance(false)">AVANZAR SI ≥75%</button><button onclick="advance(true)">FORZAR AVANCE</button><button onclick="simple(\'pause\')">PAUSAR</button><button onclick="simple(\'end\')">FINALIZAR</button>';stages.innerHTML=d.stages.map(s=>'<div class="stage '+(s.status==='open'?'open':'')+'"><b>'+s.position+' · '+s.stage_key+'</b><br><small>'+s.status+' · '+s.type+'</small>'+(s.type==='table_decision'?'<br><button onclick="resolve(\''+s.id+'\','+(s.stage_key==='final-question')+')">RESOLVER</button>':'')+'</div>').join('');tables.innerHTML=d.tables.map(t=>'<div class="stage"><b>'+(t.team_name||'Mesa')+'</b> · '+t.score_cache+' pts<br><small>'+(t.ready?'Lista':'Pendiente')+'</small><br><button onclick="comp(\''+t.id+'\')">COMPENSAR</button></div>').join('')}catch(e){summary.textContent=e.message}}
async function advance(force){try{await q('advance',{force});refresh()}catch(e){alert(e.message)}}async function resolve(id,final){try{await q(final?'resolve_wager':'resolve',{stageId:id});refresh()}catch(e){alert(e.message)}}async function simple(op){if(op==='end'&&!confirm('¿Finalizar el juego?'))return;try{await q(op);refresh()}catch(e){alert(e.message)}}async function comp(id){const delta=Number(prompt('Ajuste visible (+/- puntos)','0'));if(!Number.isFinite(delta))return;const note=prompt('Motivo de contingencia','')||'';try{await q('compensate',{tableId:id,delta,secretDelta:0,note});refresh()}catch(e){alert(e.message)}}load.onclick=refresh;
</script></html>
